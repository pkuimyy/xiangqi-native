name: Windows native build
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: windows-2025
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/build.ps1 -Configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: XiangqiNative-win-x64
          path: build/winui/Release
